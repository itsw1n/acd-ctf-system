name: CI — Next.js

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# One run per ref: a new push cancels the stale duplicate (push + PR runs
# would otherwise boot two Supabase stacks and waste minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Format, Lint, Types, Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  integration:
    name: Build and E2E (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Must support new-format API keys in `status -o env`
          # (PUBLISHABLE_KEY / SECRET_KEY); setup-cli default is older.
          version: 2.116.0
      - run: supabase start
      - name: Reset local database
        # `db reset` recreates containers and can hit a Docker port-bind
        # race; retry instead of failing the run on a flake.
        run: |
          for attempt in 1 2 3; do
            echo "db reset attempt $attempt..."
            if supabase db reset; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'db reset failed after 3 attempts'
              exit 1
            fi
            sleep 15
          done
      - name: Export local Supabase env
        run: supabase status -o env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - name: Map Supabase env to app vars
        # NOTE: `status -o env` quotes values (API_URL="http://..."),
        # so strip quotes — zod url() rejects them.
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL//\"/}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY//\"/}" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY//\"/}" >> "$GITHUB_ENV"
          # Throwaway key for CI only (throwaway DB): satisfies the required
          # FLAG_ENCRYPTION_KEY so build/E2E can exercise encrypt/decrypt.
          echo "FLAG_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
